[package]
name = "coppervox-voxels"
version.workspace = true
edition.workspace = true
authors.workspace = true


[dependencies]
bevy.workspace = true

# Infinite map made of chunks containing cells
gridmap = { git = "https://github.com/oschijns/gridmap.git", branch = "dev" }

bitvec = "1"
block-mesh = "0.2"
disjoint-hash-set = "1.0"
dot_vox = "4.1"
fxhash = "0.2"
image = "0.24"
nalgebra = "0.32"
nd_vec = "0.4"
ndarray = "0.15"
ndshape = "0.3"
num = "0.4"
pathfinding = "4.9"
petgraph = "0.6"
seq-macro = "0.3"
serde = { version = "1.0", features = ["derive"] }
slab_tree = "0.3"
