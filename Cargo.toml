[workspace]
resolver = "2"
members = [
    "crates/bind",
    "crates/common",
    "crates/config",
    "crates/importer",
    "crates/analyzer",
    "crates/runner",
    "crates/app",
]

[workspace.package]
authors = ["Olivier SCHYNS <https://github.com/oschijns>"]
homepage = "https://worldline.com/"
repository = "https://github.com/oschijns/coppervox"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]

# Provide explicit errors
thiserror = "2.0"

# Render the scene using Kiss3D
# [Kiss3D](https://github.com/dimforge/kiss3d/)
kiss3d = { version = "0.45", features = ["serde"] }
wgpu = "29.0"
