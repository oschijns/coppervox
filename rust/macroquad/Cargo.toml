[package]
name = "coppervox_macroquad"
description = "CopperVox runner based on macroquad"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Import files and convert them into voxel models
coppervox_importer = { path = "../importer" }

# Analyze voxel model to generate a logic circuit
coppervox_analyzer = { path = "../analyzer" }

# Read command-line arguments
clap = { version = "4.5", features = ["derive"] }

# Read config file
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"

# macroquad
macroquad = "0.4"

# Incidence matrix representing a directed graph
petgraph.workspace = true
