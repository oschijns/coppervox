[package]
name = "coppervox"
version = "0.0.1"
edition = "2024"


[dependencies]
bevy.workspace = true
coppervox-logic = { path = "../coppervox-logic" }
coppervox-voxels = { path = "../coppervox-voxels" }

clap = { version = "4.5", features = ["derive"] }
clio = { version = "0.3", features = ["clap-parse"] }
dot_vox = "4.1"
num = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
