[package]
name = "coppervox-analyzer"
description = "CopperVox analyzer library"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# Common data structures
coppervox-common = { path = "../common" }

# Regroup labels to identify islands
disjoint-hash-set = "1"

# Morphology of a component
bitvec = "1"

# Generate mesh from voxel model
block-mesh = "0.2"
ndshape = "0.3"
itertools = "0.15"

# TODO: replace current meshing solution with this one
binary-greedy-meshing = "0.5"

# Incidence matrix representing a directed graph
petgraph = "0.8"
