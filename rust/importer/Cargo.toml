[package]
name = "coppervox_importer"
description = "CopperVox import various file format"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Main handler for CopperVox
coppervox_analyzer = { path = "../analyzer" }

# Incidence matrix representing a directed graph
petgraph.workspace = true

# Load config data from TOML, JSON
serde = "1.0"
toml = "0.9"
serde_json = "1.0"

glam = "0.30"

# Magica Voxel
dot_vox = "5.1"

# Goxel
#gox = "0.4"

# GIMP
xcf = "0.4"
