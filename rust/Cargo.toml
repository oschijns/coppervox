[workspace]
resolver = "2"
members = ["analyzer", "godot"]

[workspace.package]
authors = ["Olivier SCHYNS <https://github.com/oschijns>"]
homepage = "https://worldline.com/"
repository = "https://github.com/oschijns/coppervox"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]

# Provide explicit errors
thiserror = "2.0"

# Pack bits
bitvec = "1"

# Incidence matrix representing a directed graph
petgraph = "0.8"
