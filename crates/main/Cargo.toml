[package]
name = "coppervox_main"
description = "CopperVox entrypoint"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Import files and convert them into voxel models
coppervox_importer = { path = "../importer" }

# Analyze voxel model to generate a logic circuit
coppervox_analyzer = { path = "../analyzer" }

# Runner for a logic circuit
coppervox_runner = { path = "../runner" }

# Read command-line arguments
clap = { version = "4.5", features = ["derive"] }


# Render the scene using Kiss3D
# [Kiss3D](https://github.com/dimforge/kiss3d/)
kiss3d = { version = "0.39", features = ["serde"] }
