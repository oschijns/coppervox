[package]
name = "coppervox_importer"
description = "CopperVox import various file format"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Main handler for CopperVox
coppervox_analyzer = { path = "../analyzer" }

# Convert incidence matrix into storage buffer
bitvec.workspace = true

# Incidence matrix representing a directed graph
petgraph.workspace = true

# Load config data from TOML, JSON
serde = "1.0"
toml = "0.9"
serde_json = "1.0"

# Load magica voxel files
dot_vox = "5.1"

# Load GIMP files
xcf = "0.4"
