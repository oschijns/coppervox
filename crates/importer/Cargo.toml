[package]
name = "coppervox_importer"
description = "CopperVox import various file format"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Main data types for CopperVox
coppervox_common = { path = "../common" }

# Load a config containing Kiss3D data structures
kiss3d.workspace = true

# Read config file
serde = { version = "1.0", features = ["derive"] }
regex = "1.12"

#
glam = "0.30"


# Voxel file formats

# Magica Voxel
dot_vox = "5.1"

# Goxel
#gox = "0.4"

# GIMP
xcf = "0.4"
