[package]
name = "coppervox_main"
description = "CopperVox entrypoint"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Common data structures
coppervox_common = { path = "../common" }

# Import files and convert them into voxel models
coppervox_importer = { path = "../importer" }

# Analyze voxel model to generate a logic circuit
coppervox_analyzer = { path = "../analyzer" }

# Runner for a logic circuit
coppervox_runner = { path = "../runner" }

# Render the scene using Kiss3D
kiss3d.workspace = true

# Read command-line arguments
clap = { version = "4.5", features = ["derive"] }

# Define file formats supported for loading configurations
ron = "0.8"
toml = "0.9"
serde_json = "1.0"

#[dev.dependencies]

# Pass data to WGSL
wgpu       = "25"
bytemuck   = { version = "1", features = ["derive"] }
env_logger = "0.11"
rand       = "0.10"
