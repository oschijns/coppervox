[package]
name = "coppervox-runner"
description = "CopperVox runtime"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# Provide explicit errors
thiserror.workspace = true

# Common data types
coppervox-common = { path = "../common" }

# Load a configuration from a text file
coppervox-config = { path = "../config" }

# Analyze voxel model to generate a logic circuit
coppervox-analyzer = { path = "../analyzer" }

# Read config file
serde = { version = "1.0", features = ["derive"] }
regex = "1.13"


# Render the scene using Kiss3D
kiss3d.workspace = true
wgpu.workspace = true

# Pass data to WGSL
bytemuck = { version = "1", features = ["derive"] }

# Allow using WASM modules
wasmtime = "50.0"