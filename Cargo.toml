[package]
name = "coppervox"
version = "0.1.0"
edition = "2021"


[workspace]
members = ["lib/*"]


[profile.dev]
opt-level = 1


[profile.dev.package."*"]
opt-level = 3


[dependencies]
bevy = "0.15"
clap = { version = "4.5", features = ["derive"] }
clio = { version = "0.3", features = ["clap-parse"] }
coppervox_logic = { path = "lib/coppervox_logic" }
coppervox_voxels = { path = "lib/coppervox_voxels" }
dot_vox = "4.1"
leafwing-input-manager = "0.16"
num = "0.4"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
