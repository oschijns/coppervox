[workspace]
resolver = "2"
members = [
    "crates/coppervox",
    "crates/coppervox-logic",
    "crates/coppervox-voxels",
]

[workspace.package]
authors = ["Olivier Schyns <https://github.com/oschijns>"]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bevy = "0.16"

[profile.dev]
opt-level = 1


[profile.dev.package."*"]
opt-level = 3
